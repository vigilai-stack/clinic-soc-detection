title: EHR service account used from a clinical workstation
id: f2075334-6666-4f5c-9078-8f9011223308
status: experimental
description: >
  svc.ehr and svc.backup should run on servers. A network logon (type 3)
  or an explicit-credential event (4648) from a PC in the workstation
  subnet means a person typed that password or a program on that PC did.
author: Sangeeta Sinha, VigilAI Solutions
date: '2026-11-19'
logsource:
  product: windows
  service: security
detection:
  sel_network:
    EventID: 4624
    LogonType: 3
    TargetUserName:
      - svc.ehr
      - svc.backup
    IpAddress|startswith: '10.20.1.'
  sel_explicit:
    EventID: 4648
    TargetUserName:
      - svc.ehr
      - svc.backup
    Computer|startswith: 'WS-'
  condition: sel_network or sel_explicit
  timeframe: 30m
  group_by:
    - IpAddress
level: high
tags:
  - attack.lateral_movement
  - attack.t1021.002
  - attack.t1078.002
attack:
  - id: T1021.002
    name: SMB/Windows Admin Shares
    tactic: Lateral Movement
  - id: T1078.002
    name: Domain Accounts
    tactic: Lateral Movement
falsepositives:
  - A workstation that was accidentally given a server address in 10.20.1.0/24. Check the directory.
  - The backup server is 10.20.2.30 and is not covered by the workstation prefix.
hipaa:
  concern: >
    The EHR service account can see more of the system than any front desk login.
  minimum_necessary: >
    A service account is not a workforce member's personal login. Someone using
    it from a front desk PC is outside every job description.
  breach_notification: >
    Reset the service-account password after you are sure the scheduled EHR
    jobs have a new one, or the clinic will lose the application the next morning.
    Then look at which charts were touched.
playbook: playbooks/win_service_account_from_workstation.md
triage: >
  Find the workstation IP. Disconnect that PC from the network and leave it on.
  Disable the interactive use of the service account. Check the file server for
  new shares and for shadow-copy deletion. Do not reboot the EHR server in the
  middle of the clinic day unless IT says the process is still running.
