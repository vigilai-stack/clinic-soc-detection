title: Many patient-portal usernames failed from one address
id: 4f6a2c10-7b31-4d55-8e90-1c2a3b4d5e01
status: experimental
description: >
  One internet address failed sign-in for many different portal usernames
  in a short window. A patient forgets their own password. They do not
  walk through the directory.
author: Sangeeta Sinha, VigilAI Solutions
date: '2026-11-19'
logsource:
  product: clinic
  service: portal
detection:
  selection:
    result: failure
  filter_monitor:
    username|startswith: healthcheck-
  condition: selection and not filter_monitor | count(distinct username) by src_ip > 10
  timeframe: 15m
level: high
tags:
  - attack.credential_access
  - attack.t1110.004
attack:
  - id: T1110.004
    name: Credential Stuffing
    tactic: Credential Access
falsepositives:
  - A guest wireless network that hides many patients behind one address, if the threshold is too low.
  - The clinic's own monitor, which this rule excludes by username prefix.
hipaa:
  concern: >
    The portal shows appointments, messages, and bills. Those are patient records.
  minimum_necessary: >
    This is an outside access attempt, not a workforce member doing their job.
  breach_notification: >
    Failures alone, with no successful session, are an attempt. A later success
    from the same address should start the four-factor risk assessment in
    45 CFR 164.402 with counsel. Individual notice, if counsel says it is required,
    is due without unreasonable delay and no later than 60 days after discovery
    (45 CFR 164.404).
playbook: playbooks/portal_credential_stuffing.md
triage: >
  Count the distinct usernames and check whether any of them later succeeded
  from this same address. Block the address. Reset only the accounts that
  actually signed in. Leave the portal up for other patients.
